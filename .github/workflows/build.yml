name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Permissions nécessaires pour créer des releases
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-ARM64

          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-Intel

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

          # Linux désactivé temporairement (problème glslc/Vulkan)
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   name: Linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Rust pour accélérer les builds
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}

      # Windows : cmake puis Vulkan SDK (LunarG installateur silencieux officiel)
      - name: Install cmake (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install Vulkan SDK (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "1.3.296.0"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading Vulkan SDK $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\vulkan-sdk.exe"
          Write-Host "Running silent installer..."
          $installer = Start-Process -FilePath "$env:TEMP\vulkan-sdk.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            Write-Error "Vulkan SDK installer exited with code $($installer.ExitCode)"
            exit 1
          }
          Write-Host "Exporting environment variables for next steps"
          echo "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$version\Bin" >> $env:GITHUB_PATH
          Write-Host "Verifying installation..."
          if (-not (Test-Path "C:\VulkanSDK\$version\Bin\glslc.exe")) {
            Write-Error "Vulkan SDK installation failed: glslc.exe not found at C:\VulkanSDK\$version\Bin\"
            exit 1
          }

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'N-Gage ${{ github.ref_name }}'
          releaseBody: |
            ## N-Gage ${{ github.ref_name }}

            Application de dictée vocale 100% offline pour professionnels SST.

            ### Téléchargements
            - **macOS Apple Silicon** (M1/M2/M3) : .dmg aarch64
            - **macOS Intel** : .dmg x64
            - **Windows** : .msi
            - **Linux** : .deb / .AppImage

            ### Installation
            1. Télécharger le fichier correspondant à votre système
            2. Installer l'application
            3. Au premier lancement, télécharger un modèle Whisper
            4. Autoriser les permissions (micro + accessibilité)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Gage-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
